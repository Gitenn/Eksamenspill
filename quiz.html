<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAVE3625 Exam Lab</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Loaded first so it can report errors from any file loaded after it. -->
  <script src="js/errors.js"></script>
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>

  <main class="wrap">
    <h1>DAVE3625 EXAM LAB</h1>
    <p class="sub">Introduction to AI // closed-book cram deck</p>
    <div id="errbar" class="errbar" hidden></div>
    <div id="menu"></div>
    <div id="quiz" hidden></div>
    <div id="results" hidden></div>
  </main>

  <!-- Question banks. A missing file is ignored; a file with a syntax error shows in the red banner. -->
  <script src="questions/questions_00_sample.js" onerror="void 0"></script>
  <script src="questions/questions_01_evaluation.js" onerror="void 0"></script>
  <script src="questions/questions_02_mlbasics.js" onerror="void 0"></script>
  <script src="questions/questions_03_data.js" onerror="void 0"></script>
  <script src="questions/questions_04_regclust.js" onerror="void 0"></script>
  <script src="questions/questions_05_mlyearning.js" onerror="void 0"></script>
  <script src="questions/questions_06_genai.js" onerror="void 0"></script>
  <script src="questions/questions_07_buildmodel.js" onerror="void 0"></script>
  <script src="questions/questions_08_aiindex.js" onerror="void 0"></script>
  <script src="questions/questions_09_labs.js" onerror="void 0"></script>
  <script src="questions/questions_10_prompting.js" onerror="void 0"></script>
  <script src="questions/questions_11_history.js" onerror="void 0"></script>

  <!-- Application code. Order matters: each file may use the ones above it. -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/data.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/session.js"></script>
  <script src="js/ui/screens.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/menu.js"></script>
  <script src="js/ui/quiz.js"></script>
  <script src="js/ui/results.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
